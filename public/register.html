<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>El Golpe - Registro</title>
</head>
<body>
<h1>Registro</h1>

<form id="formRegistro">
    <p>Nombre: <input type="text" id="nombre" required></p>
    <p>Email: <input type="email" id="email" required></p>
    <p>Contraseña: <input type="password" id="password" required></p>
    <button type="submit">Crear cuenta</button>
</form>

<p id="mensaje"></p>
<p><a href="login.html">¿Ya tienes cuenta? Inicia sesión</a></p>

<script>
    const API = "/dsaApp/elgolpe";

    document.getElementById("formRegistro").addEventListener("submit", async function (e) {
        e.preventDefault();
        const mensaje = document.getElementById("mensaje");

        const datos = {
            nombre: document.getElementById("nombre").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
        };

        try {
            const res = await fetch(API + "/usuarios/registro", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(datos)
            });

            if (res.status === 201) {
                const usuario = await res.json();
                mensaje.textContent = "Cuenta creada. Empiezas con " + usuario.monedas + " monedas. Ahora inicia sesión.";
            } else if (res.status === 409) {
                mensaje.textContent = "Ya existe un usuario con ese nombre.";
            } else if (res.status === 400) {
                mensaje.textContent = "Rellena todos los campos.";
            } else {
                mensaje.textContent = "Error " + res.status;
            }
        } catch (err) {
            mensaje.textContent = "No se puede conectar con el servidor.";
        }
    });
</script>
</body>
</html>
